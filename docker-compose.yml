services:
  api:
    build: ./api
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-claude-sonnet-5-5}
      - BOMERANG_DATA_DIR=/data
    volumes:
      - bomerang-data:/data
    ports:
      - "8000:8000"
  web:
    build: ./web
    environment:
      - API_URL=http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  bomerang-data:

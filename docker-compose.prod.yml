# Production stack for a single always-on server (e.g. Oracle Cloud Always Free).
#   cp .env.example .env   # then edit it
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      - BOMERANG_DATA_DIR=/data
    volumes:
      - bomerang-data:/data
    # Not published to the internet; only Caddy (web) talks to it.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  bomerang-data:
  caddy-data:
  caddy-config:
